<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крестики-Нолики</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .app {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            max-width: 1000px;
            width: 100%;
        }

        .game-section {
            background: #181c24;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            flex: 2;
            min-width: 270px;
        }

        .chat-section {
            background: #181c24;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            flex: 1.2;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: #eef2fc;
            border-left: 3px solid #7c9ec2;
            padding-left: 12px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #11141c;
            padding: 12px;
            border-radius: 20px;
            margin: 14px 0 18px;
        }

        .cell {
            aspect-ratio: 1;
            background: #282f3d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.05s linear;
            color: #e6edf6;
            font-family: monospace;
        }
        .cell.X { color: #e0a06e; }
        .cell.O { color: #7fb38e; }
        .cell.disabled { cursor: default; opacity: 0.65; pointer-events: none; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11141c;
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .turn-text {
            font-weight: 500;
            color: #cbdae9;
            font-size: 0.9rem;
        }

        .symbol-badge {
            background: #2f3543;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #ccdeef;
        }

        button {
            background: #3e455a;
            border: none;
            color: #f0f4fc;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 44px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
            touch-action: manipulation;
        }
        button:active { background: #5b6582; }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 8px;
        }

        .connection-panel {
            background: #11141c;
            border-radius: 20px;
            padding: 14px;
            margin-top: 8px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }

        input {
            background: #0a0c12;
            border: 1px solid #3a4055;
            padding: 10px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            width: 170px;
            color: #f0f4fa;
            font-family: monospace;
        }
        input::placeholder { color: #6e768a; }

        .room-info {
            font-size: 0.7rem;
            color: #9aa4bb;
            margin-top: 6px;
            word-break: break-all;
        }

        .chat-messages {
            flex: 1;
            background: #11141c;
            border-radius: 20px;
            padding: 12px;
            min-height: 250px;
            max-height: 280px;
            overflow-y: auto;
            margin: 10px 0 12px;
            font-size: 0.8rem;
        }

        .message {
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 14px;
            color: #e2e9f2;
            word-break: break-word;
            line-height: 1.3;
        }

        .message.system {
            color: #8d99b0;
            font-style: italic;
            font-size: 0.7rem;
            border-left: 2px solid #5d6f88;
            padding-left: 10px;
        }

        .message.opponent {
            background: #262d3b;
            border-radius: 14px 14px 14px 6px;
        }

        .message.mine {
            background: #3a455f;
            text-align: right;
            border-radius: 14px 14px 6px 14px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .chat-input {
            flex: 1;
            background: #0a0c12;
            border: 1px solid #3a4055;
            border-radius: 40px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: white;
        }

        .small-btn {
            background: #3a4157;
            padding: 8px 16px;
            font-size: 0.75rem;
        }

        @media (max-width: 700px) {
            .app { flex-direction: column; }
            .chat-messages { min-height: 170px; max-height: 190px; }
            .cell { font-size: 2rem; border-radius: 12px; }
            button { padding: 8px 14px; }
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app">
    <div class="game-section">
        <h2>крестики-нолики</h2>
        <div class="status-bar">
            <div class="turn-text" id="turnStatus">ожидание</div>
            <div class="symbol-badge" id="mySymbolLabel">—</div>
        </div>
        <div class="board" id="board"></div>
        <div class="action-group">
            <button id="createBtn">создать комнату</button>
            <button id="connectBtn">подключиться</button>
            <button id="resetBtn">новая игра</button>
        </div>
        <div class="connection-panel">
            <div class="flex-row">
                <input type="text" id="roomIdInput" placeholder="id комнаты" autocomplete="off">
                <button id="copyIdBtn" class="small-btn">копировать id</button>
            </div>
            <div class="room-info" id="roomInfo">создайте комнату или введите id</div>
        </div>
    </div>

    <div class="chat-section">
        <h2>чат раунда</h2>
        <div class="chat-messages" id="chatMessages">
            <div class="message system">чат очищается после партии</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="сообщение..." autocomplete="off">
            <button id="sendChatBtn" class="small-btn">отправить</button>
        </div>
        <div class="room-info" style="margin-top: 8px;">сообщения только для текущей игры</div>
    </div>
</div>

<script>
    // ---------- игровое состояние ----------
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentTurn = 'X';
    let mySymbol = null;
    let gameActive = false;
    let winner = null;
    let isHost = false;

    // сеть
    let peer = null;
    let activeConn = null;
    let connectionRetryTimer = null;

    // DOM
    const boardDiv = document.getElementById('board');
    const turnStatusSpan = document.getElementById('turnStatus');
    const mySymbolLabelSpan = document.getElementById('mySymbolLabel');
    const createBtn = document.getElementById('createBtn');
    const connectBtn = document.getElementById('connectBtn');
    const resetBtn = document.getElementById('resetBtn');
    const roomIdInput = document.getElementById('roomIdInput');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const roomInfoSpan = document.getElementById('roomInfo');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');

    // ----- чат -----
    function addSystemMessage(text) {
        const msg = document.createElement('div');
        msg.className = 'message system';
        msg.textContent = text;
        chatMessagesDiv.appendChild(msg);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }

    function addChatMessage(sender, text, isMine) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'mine' : 'opponent'}`;
        msgDiv.textContent = `${sender}: ${text}`;
        chatMessagesDiv.appendChild(msgDiv);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }

    function clearChatHistory() {
        while (chatMessagesDiv.firstChild) {
            chatMessagesDiv.removeChild(chatMessagesDiv.firstChild);
        }
        addSystemMessage('чат очищен. новая партия.');
    }

    function sendChatMessage(text) {
        if (!text.trim()) return;
        if (!gameActive || !activeConn || !activeConn.open) {
            addSystemMessage('нет соединения');
            return;
        }
        const packet = { type: 'CHAT', text: text.trim(), sender: mySymbol };
        activeConn.send(JSON.stringify(packet));
        addChatMessage(`я (${mySymbol})`, text.trim(), true);
        chatInput.value = '';
    }

    function onReceiveChat(senderSymbol, text) {
        const displayName = senderSymbol === mySymbol ? `я (${senderSymbol})` : `соперник (${senderSymbol})`;
        addChatMessage(displayName, text, senderSymbol === mySymbol);
    }

    // ----- игровая логика -----
    function renderBoard() {
        const cells = document.querySelectorAll('.cell');
        for (let i = 0; i < 9; i++) {
            cells[i].innerText = board[i];
            cells[i].classList.remove('X', 'O', 'disabled');
            if (board[i] === 'X') cells[i].classList.add('X');
            if (board[i] === 'O') cells[i].classList.add('O');
            const clickable = gameActive && !winner && (currentTurn === mySymbol) && board[i] === '';
            if (!clickable) cells[i].classList.add('disabled');
            else cells[i].classList.remove('disabled');
        }
        if (!gameActive) turnStatusSpan.innerText = 'нет соединения';
        else if (winner === 'X') turnStatusSpan.innerText = 'победа X';
        else if (winner === 'O') turnStatusSpan.innerText = 'победа O';
        else if (winner === 'tie') turnStatusSpan.innerText = 'ничья';
        else if (currentTurn === mySymbol) turnStatusSpan.innerText = `ваш ход (${mySymbol})`;
        else turnStatusSpan.innerText = `ход соперника (${currentTurn})`;
        mySymbolLabelSpan.innerText = mySymbol ? `вы: ${mySymbol}` : '—';
    }

    function evaluateWinner() {
        const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let p of patterns) {
            const [a,b,c] = p;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                winner = board[a];
                renderBoard();
                return true;
            }
        }
        if (!board.includes('')) { winner = 'tie'; renderBoard(); return true; }
        winner = null;
        renderBoard();
        return false;
    }

    function makeLocalMove(index) {
        if (!gameActive || winner || currentTurn !== mySymbol || board[index] !== '') return false;
        board[index] = mySymbol;
        evaluateWinner();
        if (!winner) currentTurn = (currentTurn === 'X') ? 'O' : 'X';
        renderBoard();
        if (activeConn && activeConn.open) {
            const movePacket = { type: 'MOVE', idx: index, symbol: mySymbol, newBoard: board, nextTurn: currentTurn, win: winner };
            activeConn.send(JSON.stringify(movePacket));
        }
        return true;
    }

    function sendFullSync() {
        if (!activeConn || !activeConn.open) return;
        activeConn.send(JSON.stringify({ type: 'SYNC', board: board, turn: currentTurn, win: winner }));
    }

    function resetRound() {
        if (!gameActive) return;
        board = ['', '', '', '', '', '', '', '', ''];
        currentTurn = 'X';
        winner = null;
        renderBoard();
        clearChatHistory();
        if (activeConn && activeConn.open) {
            activeConn.send(JSON.stringify({ type: 'RESET' }));
            setTimeout(() => sendFullSync(), 80);
        }
    }

    // ----- универсальное кросс-платформенное подключение -----
    function destroyPeer() {
        if (connectionRetryTimer) clearTimeout(connectionRetryTimer);
        if (activeConn) {
            try { activeConn.close(); } catch(e) {}
            activeConn = null;
        }
        if (peer && !peer.destroyed) {
            try { peer.destroy(); } catch(e) {}
        }
        peer = null;
    }

    function createPeerWithGoodConfig(id, onReady) {
        // оптимизированная конфигурация для всех устройств
        const config = {
            debug: 0,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun.ekiga.net' },
                    { urls: 'stun:stun.ideasip.com' }
                ],
                iceCandidatePoolSize: 5
            }
        };
        const newPeer = new Peer(id, config);
        let resolved = false;
        const timeout = setTimeout(() => {
            if (!resolved) {
                resolved = true;
                onReady(null, 'timeout');
            }
        }, 8000);
        newPeer.on('open', (peerId) => {
            if (!resolved) {
                resolved = true;
                clearTimeout(timeout);
                onReady(newPeer, null);
            }
        });
        newPeer.on('error', (err) => {
            if (!resolved) {
                resolved = true;
                clearTimeout(timeout);
                onReady(null, err);
            }
        });
        return newPeer;
    }

    function setupConnectionHandlers(conn, hostMode) {
        conn.on('open', () => {
            if (hostMode) {
                isHost = true;
                mySymbol = 'X';
                gameActive = true;
                currentTurn = 'X';
                winner = null;
                board = ['', '', '', '', '', '', '', '', ''];
                renderBoard();
                clearChatHistory();
                addSystemMessage('соединение установлено. вы играете за X');
                roomInfoSpan.innerHTML = 'соперник подключён. вы X';
                const initPacket = { type: 'INIT', assigned: 'O', hostBoard: board, hostTurn: currentTurn, hostWinner: winner };
                conn.send(JSON.stringify(initPacket));
                setTimeout(() => sendFullSync(), 150);
            } else {
                roomInfoSpan.innerHTML = 'подключено, получаем данные...';
                addSystemMessage('подключение установлено, ожидание символа...');
                setTimeout(() => {
                    if (activeConn && activeConn.open && mySymbol === null) {
                        activeConn.send(JSON.stringify({ type: 'REQ_SYNC' }));
                    }
                }, 500);
            }
        });

        conn.on('data', (raw) => {
            try {
                const msg = JSON.parse(raw);
                if (msg.type === 'INIT' && !isHost && mySymbol === null) {
                    mySymbol = msg.assigned;
                    gameActive = true;
                    currentTurn = msg.hostTurn || 'X';
                    winner = msg.hostWinner || null;
                    board = msg.hostBoard ? [...msg.hostBoard] : ['', '', '', '', '', '', '', '', ''];
                    renderBoard();
                    clearChatHistory();
                    addSystemMessage(`вы играете за ${mySymbol}. ожидайте ход`);
                    roomInfoSpan.innerHTML = `вы ${mySymbol}, соперник X`;
                    sendFullSync();
                }
                else if (msg.type === 'MOVE') {
                    if (!gameActive) return;
                    const oppSym = mySymbol === 'X' ? 'O' : 'X';
                    if (msg.symbol !== oppSym) return;
                    if (board[msg.idx] !== '') return;
                    board = [...msg.newBoard];
                    currentTurn = msg.nextTurn;
                    winner = msg.win;
                    renderBoard();
                }
                else if (msg.type === 'SYNC') {
                    if (gameActive && mySymbol) {
                        board = [...msg.board];
                        currentTurn = msg.turn;
                        winner = msg.win;
                        renderBoard();
                    }
                }
                else if (msg.type === 'RESET') {
                    if (gameActive) {
                        board = ['', '', '', '', '', '', '', '', ''];
                        currentTurn = 'X';
                        winner = null;
                        renderBoard();
                        clearChatHistory();
                        addSystemMessage('соперник начал новую партию');
                    }
                }
                else if (msg.type === 'CHAT') {
                    if (gameActive) onReceiveChat(msg.sender, msg.text);
                }
                else if (msg.type === 'REQ_SYNC') {
                    sendFullSync();
                }
            } catch(e) { console.warn(e); }
        });

        conn.on('close', () => {
            gameActive = false;
            mySymbol = null;
            isHost = false;
            activeConn = null;
            board = ['', '', '', '', '', '', '', '', ''];
            winner = null;
            renderBoard();
            roomInfoSpan.innerHTML = 'соединение разорвано';
            addSystemMessage('соединение потеряно. создайте комнату заново');
            clearChatHistory();
        });

        conn.on('error', (e) => {
            if (conn === activeConn) activeConn = null;
        });
    }

    function createRoom() {
        destroyPeer();
        const roomId = 'ttt-' + Math.random().toString(36).substring(2, 12);
        roomInfoSpan.innerHTML = 'создание комнаты...';
        createPeerWithGoodConfig(roomId, (newPeer, err) => {
            if (err || !newPeer) {
                roomInfoSpan.innerHTML = 'ошибка: не удалось создать комнату. проверьте интернет';
                addSystemMessage('ошибка подключения к серверу. попробуйте ещё раз');
                return;
            }
            peer = newPeer;
            roomIdInput.value = peer.id;
            roomInfoSpan.innerHTML = `ваш id: ${peer.id} (жду игрока)`;
            isHost = true;
            mySymbol = null;
            gameActive = false;
            board = ['', '', '', '', '', '', '', '', ''];
            winner = null;
            renderBoard();
            clearChatHistory();
            addSystemMessage(`комната создана. отправьте id другу и ждите подключения`);

            peer.on('connection', (conn) => {
                if (activeConn) { conn.close(); return; }
                activeConn = conn;
                setupConnectionHandlers(activeConn, true);
            });
            peer.on('error', (err) => {
                if (!activeConn) roomInfoSpan.innerHTML = 'ошибка, пересоздайте комнату';
            });
        });
    }

    function joinRoom(remoteId) {
        if (!remoteId) { alert('введите id комнаты'); return; }
        destroyPeer();
        const guestId = 'guest-' + Math.random().toString(36).substring(2, 10);
        roomInfoSpan.innerHTML = 'подключение...';
        createPeerWithGoodConfig(guestId, (newPeer, err) => {
            if (err || !newPeer) {
                roomInfoSpan.innerHTML = 'ошибка подключения. проверьте id и интернет';
                addSystemMessage('не удалось подключиться. убедитесь, что комната существует');
                return;
            }
            peer = newPeer;
            const conn = peer.connect(remoteId);
            if (!conn) {
                roomInfoSpan.innerHTML = 'не удалось соединиться с комнатой';
                addSystemMessage('ошибка: возможно, комната недоступна');
                return;
            }
            activeConn = conn;
            isHost = false;
            mySymbol = null;
            gameActive = false;
            setupConnectionHandlers(activeConn, false);
            roomInfoSpan.innerHTML = `подключение к ${remoteId}...`;

            setTimeout(() => {
                if (activeConn && activeConn.open && mySymbol === null) {
                    activeConn.send(JSON.stringify({ type: 'REQ_SYNC' }));
                }
            }, 800);

            peer.on('error', () => {});
        });
    }

    // ----- сборка UI -----
    function buildBoardUI() {
        boardDiv.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.setAttribute('data-idx', i);
            cell.addEventListener('click', (e) => {
                const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
                makeLocalMove(idx);
            });
            boardDiv.appendChild(cell);
        }
        renderBoard();
    }

    createBtn.onclick = () => createRoom();
    connectBtn.onclick = () => joinRoom(roomIdInput.value.trim());
    resetBtn.onclick = () => {
        if (!gameActive || !activeConn || !activeConn.open) alert('нет активной онлайн игры');
        else resetRound();
    };
    copyIdBtn.onclick = () => {
        if (peer && peer.id && isHost) {
            navigator.clipboard.writeText(peer.id);
            alert('id скопирован');
        } else {
            alert('сначала создайте комнату');
        }
    };
    sendChatBtn.onclick = () => sendChatMessage(chatInput.value);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(chatInput.value); });

    buildBoardUI();
    roomInfoSpan.innerHTML = 'нажмите "создать комнату"';
    addSystemMessage('кросс-платформа: работает на ПК и телефонах');
</script>
</body>
</html>
